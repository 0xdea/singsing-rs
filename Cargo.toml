[workspace]
members = ["crates/singsing-rs", "crates/zucchini"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Marco Ivaldi <raptor@0xdeadbeef.info>"]
edition = "2024"
homepage = "https://0xdeadbeef.info/"
repository = "https://github.com/0xdea/singsing-rs"
readme = "README.md"
license = "MIT"
keywords = ["port-scanner", "ipv4", "tcp", "linux", "redteaming"]
exclude = [".cargo/*", ".github/*", ".img/*", ".gitignore", ".taplo.toml", "tests/*"]

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ipnet = "2.11"
pnet = "0.35"
thiserror = "2.0"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.dev]
debug = false

[workspace.lints.rust]
missing_docs = { level = "warn" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
blanket_clippy_restriction_lints = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
arbitrary_source_item_ordering = "allow"
implicit_return = "allow"
question_mark_used = "allow"
pattern_type_mismatch = "allow"
print_stdout = "allow"
print_stderr = "allow"
min_ident_chars = "allow"
single_char_lifetime_names = "allow"
impl_trait_in_params = "allow"
missing_inline_in_public_items = "allow"
inline_modules = "allow"
single_call_fn = "allow"
separated_literal_suffix = "allow"
default_numeric_fallback = "allow"
decimal_literal_representation = "allow"
arithmetic_side_effects = "allow"
integer_division = "allow"
integer_division_remainder_used = "allow"
indexing_slicing = "allow"
shadow_reuse = "allow"
multiple_crate_versions = "allow"
